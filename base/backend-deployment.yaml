apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gamebuddy
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: gamebuddy
spec:
  # Single replica: chat room membership is kept in process memory (chat.js),
  # so a second pod would split rooms. Scaling needs a Socket.IO adapter first.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: gamebuddy
    spec:
      # The backend opens one DB connection at startup and exits if it fails,
      # so wait for Postgres to accept connections first.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h \"$DATABASE_HOST\" -p 5432; do echo waiting for postgres; sleep 2; done"]
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef: { name: gamebuddy-config, key: DATABASE_HOST }
      containers:
        - name: backend
          image: gamebuddy-backend   # tag set per overlay (images: in kustomization.yaml)
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 3001
            - name: chat
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: gamebuddy-config
            - secretRef:
                name: backend-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD }
            # $(VAR) references are expanded by Kubernetes from the vars above
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DATABASE_HOST):5432/$(POSTGRES_DB)
            # Real key lives only in the cluster (created by scripts/bootstrap.sh
            # from your .env), never in git, so Argo CD neither stores nor
            # reverts it. Optional: without it, Steam login returns 503.
            - name: STEAM_API_KEY
              valueFrom:
                secretKeyRef: { name: steam-api-key, key: STEAM_API_KEY, optional: true }
          readinessProbe:
            tcpSocket: { port: api }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000   # "node" user in the image
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
