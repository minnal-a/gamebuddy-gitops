apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gamebuddy
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: gamebuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: gamebuddy
    spec:
      containers:
        - name: frontend
          # Static build; the API/chat URLs were baked in at image build time
          image: gamebuddy-frontend   # tag set per overlay (images: in kustomization.yaml)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
