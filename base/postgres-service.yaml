# Headless service: gives the StatefulSet pod a stable DNS name
# (postgres-0.postgres) and lets the backend reach it at "postgres".
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gamebuddy
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: gamebuddy
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
