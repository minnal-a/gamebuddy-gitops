# App secrets (local development value). The Steam key is not here: it is
# the out-of-git "steam-api-key" Secret (see base/backend-deployment.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: gamebuddy
  labels:
    app.kubernetes.io/part-of: gamebuddy
type: Opaque
stringData:
  SECRET_KEY: local-dev-only-jwt-secret
