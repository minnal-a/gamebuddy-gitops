# App secrets. SECRET_KEY is a local development value; STEAM_API_KEY is
# deliberately empty here and set from your .env by scripts/up.sh, so the
# real key never lands in git.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: gamebuddy
  labels:
    app.kubernetes.io/part-of: gamebuddy
type: Opaque
stringData:
  SECRET_KEY: local-dev-only-jwt-secret
  STEAM_API_KEY: ""
