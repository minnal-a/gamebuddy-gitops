# LOCAL DEVELOPMENT VALUE ONLY. Committed so the kind cluster comes up with
# one command; real environments must supply this from a secret manager
# (e.g. Sealed Secrets / External Secrets in the GitOps phase), never git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: gamebuddy
  labels:
    app.kubernetes.io/part-of: gamebuddy
type: Opaque
stringData:
  # URL-safe characters only: it is interpolated into DATABASE_URL
  POSTGRES_PASSWORD: local-dev-only-7f3c9a2e
