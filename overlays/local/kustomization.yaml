# Local kind cluster: kubectl apply -k overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres-secret.yaml
  - backend-secret.yaml
patches:
  - path: configmap-urls.yaml
# Images built locally and loaded into kind (scripts/load-images.sh).
# CI will bump these tags once images are pushed to a registry.
images:
  - name: gamebuddy-backend
    newTag: local
  - name: gamebuddy-frontend
    newTag: local
